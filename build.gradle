import java.nio.file.Path

plugins {
    id 'java'
}

group = 'pl.olafcio.reflectstorm'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(5)
    }
}

subprojects {
    afterEvaluate {
        if ('jdk_path' in it.properties) {
            compileJava.options.fork = true
            compileJava.options.forkOptions.javaHome = Path.of((String) it.properties.jdk_path).toFile()
        }

        var project = it
        var javaVersion = JavaLanguageVersion.of(Integer.parseInt((String) project.properties.jdk_version))

        dependencies {
            testCompileOnly rootProject.sourceSets.test.output
        }

        compileTestJava {
            targetCompatibility = javaVersion
        }

        java {
            targetCompatibility = javaVersion

            toolchain {
                languageVersion = javaVersion
            }
        }

        base {
            archivesName = "reflectstorm-${project.name.substring(4)}"
        }
    }
}

allprojects {
    afterEvaluate {
        repositories {
            mavenCentral()
        }

        dependencies {
            testImplementation 'junit:junit:4.13.2'
        }

        tasks.withType(Test).tap {
            configureEach {
                enabled = false
            }
        }

        tasks.register('testJar', Jar) {
            from compileTestJava
            archiveFileName.set('../test-libs/compileTest.jar')
        }

        var project = it
        if (project == rootProject)
            return

        tasks.register('tests', JavaExec) {
            dependsOn build
            dependsOn testJar

            var testFiles = rootProject.file("src/test/java/").list()
                                                   .findAll(fn -> fn.endsWith(".java"))
                                                   .collect(fn -> fn.substring(0, fn.length() - 5))

            maxHeapSize = '128M'
            classpath = configurations.compileClasspath + configurations.runtimeClasspath +
                        configurations.testCompileClasspath + configurations.testRuntimeClasspath +
                        rootProject.files(testJar.archiveFile) +
                        rootProject.files(jar.archiveFile) +
                        rootProject.files(project.tasks.jar.archiveFile)

            mainClass = 'org.junit.runner.JUnitCore'
            args = testFiles
        }
    }
}
